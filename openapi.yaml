              schema:
                $ref: '#/components/schemas/ApiError'
      description: >-
        Applies a declarative authorization manifest (permissions, roles, access policies) to a scope. Supports
        idempotent apply via idempotencyKey.
      parameters:
        - name: scopeId
          in: path
          required: true
          description: Scope ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manifest:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                      enum:
                        - null
                    spec:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum:
                            - null
                        deletionPolicy:
                          type: string
                          enum:
                            - null
                        dryRun:
                          type: boolean
                        idempotencyKey:
                          type: string
                        requestTimestamp:
                          type: string
                        permissions:
                          type: array
                          items:
                            type: string
                        roles:
                          type: array
                          items:
                            type: string
                        accessPolicies:
                          type: array
                          items:
                            type: string
                      required:
                        - mode
                        - deletionPolicy
                        - permissions
                        - roles
                        - accessPolicies
                  required:
                    - apiVersion
                    - kind
                    - spec
                serialization:
                  type: string
                  enum:
                    - json
                    - yaml
              required:
                - manifest
              example:
                manifest:
                  apiVersion: string
                  kind: example
                  spec:
                    mode: example
                    deletionPolicy: example
                    permissions:
                      - example
                    roles:
                      - example
                    accessPolicies:
                      - example
